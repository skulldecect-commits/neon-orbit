<script>
(() => {
const TIMEZONES = ['Asia/Tokyo', 'America/New_York', 'Europe/London', 'UTC'];
function dateKey(date = new Date(), timeZone = 'Asia/Tokyo') {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
  const part = type => parts.find(item => item.type === type).value;
  return `${part('year')}-${part('month')}-${part('day')}`;
}
function shiftMonth(year, month, offset) {
  const date = new Date(year, month + offset, 1, 12);
  return { year: date.getFullYear(), month: date.getMonth() };
}
function monthDays(year, month) {
  const count = new Date(year, month + 1, 0, 12).getDate();
  return Array.from({ length: count }, (_, index) => {
    const day = index + 1;
    return { day, weekday: new Date(year, month, day, 12).getDay(), key: `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}` };
  });
}
function stepAngle(angle, direction, count) {
  const step = 360 / count;
  return Math.round(angle / step) * step - direction * step;
}
function validDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [year, month, day] = value.split('-').map(Number);
  if (year < 1000 || month < 1 || month > 12 || day < 1) return false;
  return day <= new Date(year, month, 0).getDate();
}

function carouselGeometry(width, availableHeight, count, spacing = 100) {
  const height = Math.max(48, Math.min(900, availableHeight));
  const cardWidth = Math.min(width * .94, height * .9, 760);
  const perspective = Math.max(400, Math.min(1050, width * 1.08));
  const radius = Math.max(cardWidth * .65, cardWidth / (2 * Math.tan(Math.PI / Math.max(6, count))) * 1.22) * spacing / 100;
  const lift = Math.min(radius * .38, height * .48);
  let minY = Infinity, maxY = -Infinity;

  // Fit the projected corners through a full turn, including the frame thickness.
  // The camera stays close for depth; only vertical dimensions need adjusting.
  for (let degrees = 0; degrees < 360; degrees += 2) {
    const theta = degrees * Math.PI / 180;
    const depth = (1 - Math.cos(theta)) / 2;
    for (const edge of [-cardWidth / 2, cardWidth / 2]) {
      const z = -2 * radius * depth - edge * Math.sin(theta) + Math.abs(3 * Math.cos(theta));
      const scale = perspective / (perspective - z);
      minY = Math.min(minY, (-lift * depth - height / 2) * scale);
      maxY = Math.max(maxY, (-lift * depth + height / 2) * scale);
    }
  }
  const fit = Math.min(1, Math.max(1, availableHeight - 8) / (maxY - minY));
  return {
    cardWidth, cardHeight: height * fit, perspective, radius, lift: lift * fit,
    centerY: (availableHeight - (maxY - minY) * fit) / 2 - minY * fit
  };
}


const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const icon = name => { const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('icon'); svg.setAttribute('aria-hidden', 'true'); const use = document.createElementNS(svg.namespaceURI, 'use'); use.setAttribute('href', `#i-${name}`); svg.append(use); return svg; };
const element = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };

const settings = { speed: 6, radius: 100, direction: 1, frame: true, hearts: true, zone: 'Asia/Tokyo', clockPosition: 'tr', calendar: false };

  const saved = JSON.parse(localStorage.getItem('neon-orbit-preferences') || '{}');
  if (Number.isFinite(saved.speed)) settings.speed = Math.max(2, Math.min(24, saved.speed));
  if (Number.isFinite(saved.radius)) settings.radius = Math.max(75, Math.min(135, saved.radius));
  if (saved.direction === 1 || saved.direction === -1) settings.direction = saved.direction;
  for (const key of ['frame', 'hearts', 'calendar']) if (typeof saved[key] === 'boolean') settings[key] = saved[key];
  if (TIMEZONES.includes(saved.zone)) settings.zone = saved.zone;
  if (['tl','tc','tr','bl','bc','br'].includes(saved.clockPosition)) settings.clockPosition = saved.clockPosition;
} catch { /* Default preferences remain available if browser storage is restricted. */ }

let db = null;
let storageReady = false;
let photos = [];
let events = [];
let playing = !motionPreference.matches;
let quiet = false;
let importing = false;
let photoMutation = false;
let storageWarningShown = false;
let selectedDate = dateKey(new Date(), settings.zone);
let displayedMonth = { year: Number(selectedDate.slice(0, 4)), month: Number(selectedDate.slice(5, 7)) - 1 };
let angle = 0;
let targetAngle = null;
let radius = 300;
let orbitLift = 100;
let orbitCards = [];
let lastFrame = 0;
let pauseUntil = 0;
let drag = null;
let lastDraggedAt = 0;
let toastTimer;
let toastHost = null;

function toast(message, duration = 4400) {
  clearTimeout(toastTimer);
  const node = $('#toast');
  const host = $$('dialog[open]').at(-1) || document.body;
  host.append(node);
  toastHost = host;
  node.textContent = message;
  node.hidden = false;
  toastTimer = setTimeout(() => { node.hidden = true; document.body.append(node); toastHost = null; }, duration);
}
function savePreferences() {
  try { localStorage.setItem('neon-orbit-preferences', JSON.stringify(settings)); }
  catch { if (!storageWarningShown) { storageWarningShown = true; toast('表示設定を保存できませんでした。この画面では変更を使えます。'); } }
}
function openDrawer(id) {
  for (const dialog of $$('dialog[open]')) dialog.close();
  $(id).showModal();
  if (id === '#schedule') renderEvents();
}
$$('[data-close]').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
$$('dialog').forEach(dialog => {
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();

});
$('#settings-open').addEventListener('click', () => openDrawer('#settings'));
$('#schedule-open').addEventListener('click', () => openDrawer('#schedule'));

function openDB() {
  return new Promise((resolve, reject) => {
    let settled = false;
    const request = indexedDB.open('neon-orbit-local-v1', 1);
    const fail = () => { if (!settled) { settled = true; clearTimeout(timer); reject(new Error('Storage unavailable')); } };
    const timer = setTimeout(fail, 8000);
    request.onupgradeneeded = () => {
      const database = request.result;
      database.createObjectStore('photos', { keyPath: 'id' });
      database.createObjectStore('events', { keyPath: 'id' });
    };
    request.onsuccess = () => {
      if (settled) { request.result.close(); return; }
      settled = true; clearTimeout(timer);
      request.result.onversionchange = () => { request.result.close(); db = null; toast('保存領域が更新されました。ページを再読み込みしてください。'); };

    };
    request.onerror = fail;
    request.onblocked = fail;
  });
}
function readAll(store) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(store, 'readonly');
    const request = transaction.objectStore(store).getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

  return new Promise((resolve, reject) => {
    if (!db || !storageReady) { reject(new Error('Storage unavailable')); return; }
    const transaction = db.transaction(store, 'readwrite');
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
    try { change(transaction.objectStore(store)); }
    catch (error) { transaction.abort(); reject(error); }
  });
}

function buildCarousel() {
  const cylinder = $('#cylinder');
  cylinder.replaceChildren();
  const count = photos.length ? Math.max(6, photos.length) : 6;
  for (let index = 0; index < count; index++) {
    const card = element('div', 'orbit-card');
    card.classList.toggle('frameless', !settings.frame && photos.length > 0);
    card.style.setProperty('--card-glow', ['255 82 153', '111 229 234', '183 134 255'][index % 3]);
    if (photos.length) {
      const photo = photos[index % photos.length];
      const front = element('div', `card-face${settings.frame ? '' : ' no-frame'}`);
      const img = element('img'); img.src = photo.url; img.alt = photo.name; img.draggable = false; front.append(img);
      if (index >= photos.length) front.setAttribute('aria-hidden', 'true');
      const back = element('div', `card-face card-back${settings.frame ? '' : ' no-frame'}`); back.setAttribute('aria-hidden', 'true');
      const backImage = img.cloneNode(); backImage.alt = ''; back.append(backImage); card.append(front, back);
    } else {
      const front = element('button', 'card-face empty-card'); front.type = 'button';
      front.setAttribute('aria-label', '画像を追加');
      front.append(icon('plus'));
      if (index > 0) { front.tabIndex = -1; front.setAttribute('aria-hidden', 'true'); }
      front.addEventListener('click', () => { if (performance.now() - lastDraggedAt > 300) $('#file-input').click(); });
      const back = element('div', 'card-face card-back'); back.setAttribute('aria-hidden', 'true'); card.append(front, back);
    }

  }

  $('#ambient-photo').style.backgroundImage = photos.length ? `url("${photos[0].url}")` : 'none';
  $('#reset-images').disabled = photos.length === 0 || photoMutation;
  renderImageManager();
  layout();
}
function renderImageManager() {
  const manager = $('#image-manager'); manager.replaceChildren();
  for (const photo of photos) {
    const thumb = element('div', 'image-thumbnail');
    const img = element('img'); img.src = photo.url; img.alt = photo.name; img.loading = 'lazy';
    const button = element('button'); button.type = 'button'; button.setAttribute('aria-label', `${photo.name}を削除`); button.append(icon('close')); button.disabled = photoMutation;

  }
}
function layout() {
  const stage = $('#stage'), cylinder = $('#cylinder');
  const rect = stage.getBoundingClientRect();
  const controls = $('.gallery-controls').getBoundingClientRect();
  const width = rect.width;
  const clock = $('#clock').getBoundingClientRect();
  let top = 12;
  let bottom = controls.top - rect.top - 14;
  if (!quiet) {
    if (clock.top - rect.top < rect.height / 2) top = Math.max(top, clock.bottom - rect.top + 12);
    else bottom = Math.min(bottom, clock.top - rect.top - 12);
  } else { top = 12; bottom = rect.height - 12; }
  const geometry = carouselGeometry(width, Math.max(48, bottom - top), orbitCards.length, settings.radius);
  const { cardWidth, cardHeight } = geometry;
  const center = top + geometry.centerY;
  radius = geometry.radius;
  orbitLift = geometry.lift;
  stage.style.perspective = `${geometry.perspective}px`;
  stage.style.perspectiveOrigin = `50% ${center}px`;
  cylinder.style.width = `${cardWidth}px`; cylinder.style.height = `${cardHeight}px`;
  cylinder.style.marginLeft = `${-cardWidth / 2}px`; cylinder.style.marginTop = `${-cardHeight / 2}px`; cylinder.style.top = `${center}px`;
  applyRotation();
}
function applyRotation() {
  orbitCards.forEach((card, index) => {
    const rotation = angle + index * 360 / orbitCards.length;
    const theta = rotation * Math.PI / 180;
    const depth = (1 - Math.cos(theta)) / 2;
    card.style.transform = `translate3d(${Math.sin(theta) * radius}px, ${-orbitLift * depth}px, ${-2 * radius * depth}px) rotateY(${rotation}deg)`;
    card.style.setProperty('--depth-shade', (depth * .48).toFixed(3));
  });
}
function updatePlayback() {
  const button = $('#playback');
  button.replaceChildren(icon(playing ? 'pause' : 'play'));
  button.setAttribute('aria-label', playing ? '自動回転を一時停止' : '自動回転を再生');
  button.setAttribute('title', playing ? '一時停止' : '再生');
}
function advance(direction) { targetAngle = stepAngle(angle, direction, $('#cylinder').children.length); pauseUntil = performance.now() + 3500; }
$('#previous').addEventListener('click', () => advance(-1));
$('#next').addEventListener('click', () => advance(1));
$('#playback').addEventListener('click', () => { playing = !playing; updatePlayback(); });
$('#stage').addEventListener('keydown', event => {
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') { event.preventDefault(); advance(event.key === 'ArrowRight' ? 1 : -1); }

$('#stage').addEventListener('pointerdown', event => {

$('#stage').addEventListener('pointerup', endDrag);
$('#stage').addEventListener('pointercancel', endDrag);
$('#stage').addEventListener('lostpointercapture', () => { drag = null; });

$('#stage').addEventListener('dblclick', event => { if (!event.target.closest('button')) toggleQuiet(); });

      if (Math.abs(targetAngle - angle) < .04) { angle = targetAngle; targetAngle = null; }
      applyRotation();
    } else if (playing && time > pauseUntil && !$('#stage').matches(':focus-visible') && !$('#stage').querySelector(':focus-visible')) { angle = (angle + elapsed * settings.speed * settings.direction) % 360; applyRotation(); }
  }
  requestAnimationFrame(animate);
}

function validateImage(file) {
  return new Promise((resolve, reject) => {
    if (!['image/jpeg','image/png','image/webp','image/gif','image/avif'].includes(file.type) || file.size > 25 * 1024 * 1024) { reject(new Error('Unsupported image')); return; }
    const url = URL.createObjectURL(file); const img = new Image();
    const timer = setTimeout(() => { URL.revokeObjectURL(url); reject(new Error('Image decode timeout')); }, 12000);
    img.onload = () => { clearTimeout(timer); URL.revokeObjectURL(url); resolve(file); };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); reject(new Error('Unreadable image')); };
    img.src = url;
  });
}
$$('[data-add-images]').forEach(button => button.addEventListener('click', () => $('#file-input').click()));
$('#file-input').addEventListener('change', async event => {
  const files = [...event.target.files]; event.target.value = '';
  if (!files.length || importing || photoMutation) return;
  if (!db || !storageReady) { toast('保存領域の準備ができていません。少し待つか、ページを再読み込みしてください。'); return; }
  const room = 24 - photos.length;
  if (room <= 0) { toast('画像は24枚まで追加できます。設定から画像を削除してください。'); return; }
  importing = true; photoMutation = true;
  $$('[data-add-images]').forEach(button => { button.disabled = true; });
  $('#reset-images').disabled = true; renderImageManager();
  toast('画像を読み込んでいます…', 20000);
  try {
    const results = await Promise.allSettled(files.slice(0, room).map(validateImage));
    const accepted = results.filter(result => result.status === 'fulfilled').map(result => result.value);
    if (!accepted.length) { toast('画像を読み込めませんでした。25MB以下のJPEG・PNG・WebP・GIF・AVIFを選んでください。', 6500); return; }
    const currentSize = photos.reduce((sum, photo) => sum + photo.blob.size, 0);
    if (accepted.reduce((sum, file) => sum + file.size, currentSize) > 160 * 1024 * 1024) { toast('画像の合計が160MBを超えます。枚数を減らしてお試しください。'); return; }
    const added = accepted.map((file, index) => ({ id: crypto.randomUUID(), name: file.name, blob: file, order: Date.now() + index }));
    await writeStore('photos', store => added.forEach(photo => store.put(photo)));
    photos.push(...added.map(photo => ({ ...photo, url: URL.createObjectURL(photo.blob) })));
    angle = 0; targetAngle = null;
    const skipped = files.length - added.length;
    toast(`${added.length}枚の画像を追加しました。${skipped ? ` ${skipped}枚は枚数・形式・サイズの制限で追加されませんでした。` : ''}`, skipped ? 6500 : 4400);
  } catch { toast('画像を保存できませんでした。ブラウザの空き容量を確認してお試しください。', 6500); }
  finally { importing = false; photoMutation = false; $$('[data-add-images]').forEach(button => { button.disabled = false; }); buildCarousel(); }
});
async function removePhoto(id) {
  if (photoMutation) return;
  photoMutation = true; renderImageManager(); $('#reset-images').disabled = true;
  try {
    await writeStore('photos', store => store.delete(id));
    const photo = photos.find(item => item.id === id); if (photo) URL.revokeObjectURL(photo.url);
    photos = photos.filter(item => item.id !== id); toast('画像をギャラリーから削除しました。');
  } catch { toast('削除できませんでした。画像は残っています。'); }
  finally { photoMutation = false; buildCarousel(); }
}
$('#reset-images').addEventListener('click', () => $('#confirm-delete').showModal());
$('#confirm-reset').addEventListener('click', async () => {
  if (photoMutation) return;
  photoMutation = true; $('#confirm-reset').disabled = true;
  try {
    await writeStore('photos', store => store.clear());
    photos.forEach(photo => URL.revokeObjectURL(photo.url)); photos = []; angle = 0; targetAngle = null;
    $('#confirm-delete').close(); toast('画像をすべて削除しました。');
  } catch { toast('削除できませんでした。画像は残っています。'); }
  finally { photoMutation = false; $('#confirm-reset').disabled = false; buildCarousel(); }
});

function updateClock() {
  const now = new Date();
  $('#clock-time').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: settings.zone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(now);
  $('#clock-time').dateTime = now.toISOString();
  const date = dateKey(now, settings.zone);
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: settings.zone, weekday: 'short' }).format(now).toUpperCase();
  $('#clock-date').textContent = `${date.replaceAll('-', '.')} ${weekday}`;
  if ($('#calendar').dataset.today !== date) renderCalendar();
}
function setClockPosition(value) {
  settings.clockPosition = value; $('#clock').dataset.position = value;
  document.body.classList.toggle('bottom-clock', value.startsWith('b'));
  layout();
}
function toggleCalendar() {
  settings.calendar = !settings.calendar; applyCalendarVisibility(); savePreferences();
}
function applyCalendarVisibility() {
  $('#calendar').hidden = !settings.calendar;
  document.body.classList.toggle('has-calendar', settings.calendar);
  $('#calendar-toggle').setAttribute('aria-pressed', String(settings.calendar));
  $('#calendar-toggle').setAttribute('aria-label', settings.calendar ? 'カレンダーを隠す' : 'カレンダーを表示');
  requestAnimationFrame(layout);
}
$('#calendar-toggle').addEventListener('click', toggleCalendar);
function renderCalendar() {
  const today = dateKey(new Date(), settings.zone);
  $('#calendar').dataset.today = today;
  $('#calendar-title').textContent = `${displayedMonth.year}年 ${displayedMonth.month + 1}月`;
  const grid = $('#calendar-grid'); grid.replaceChildren();
  for (const { day, weekday, key } of monthDays(displayedMonth.year, displayedMonth.month)) {
    const dayEvents = events.filter(event => event.date === key);
    const button = element('button', `day${key === today ? ' today' : ''}${key === selectedDate ? ' selected' : ''}${weekday === 0 ? ' sunday' : weekday === 6 ? ' saturday' : ''}${dayEvents.length ? ' has-events' : ''}`);
    button.type = 'button';
    button.setAttribute('aria-label', `${displayedMonth.month + 1}月${day}日 ${['日','月','火','水','木','金','土'][weekday]}曜日、${dayEvents.length ? `予定${dayEvents.length}件` : '予定なし'}`);
    if (key === today) button.setAttribute('aria-current', 'date');
    button.append(element('span', 'day-number', day), element('span', 'day-weekday', ['日','月','火','水','木','金','土'][weekday]));
    button.addEventListener('click', () => { selectedDate = key; $('#event-date').value = key; openDrawer('#schedule'); renderCalendar(); });
    grid.append(button);
  }
}
function changeMonth(offset) { displayedMonth = shiftMonth(displayedMonth.year, displayedMonth.month, offset); renderCalendar(); }
$('#month-previous').addEventListener('click', () => changeMonth(-1));
$('#month-next').addEventListener('click', () => changeMonth(1));
$('#calendar-today').addEventListener('click', () => {
  selectedDate = dateKey(new Date(), settings.zone); $('#event-date').value = selectedDate;
  displayedMonth = { year: Number(selectedDate.slice(0, 4)), month: Number(selectedDate.slice(5, 7)) - 1 }; renderCalendar(); renderEvents();
});
$('#event-date').value = selectedDate;
$('#event-date').addEventListener('change', () => { if (validDate($('#event-date').value)) { selectedDate = $('#event-date').value; renderEvents(); renderCalendar(); } });
function renderEvents() {
  const list = $('#event-list'); list.replaceChildren();
  const matching = events.filter(event => event.date === selectedDate).sort((a,b) => (a.time || '').localeCompare(b.time || '') || a.id.localeCompare(b.id));
  if (!matching.length) { list.append(element('p', 'event-empty', 'この日の予定はありません。')); return; }
  for (const event of matching) {
    const item = element('article', 'event-item');
    const detail = element('div', 'event-details');
    const time = element('time', '', event.time || '終日'); time.dateTime = event.time ? `${event.date}T${event.time}` : event.date;
    detail.append(time, element('p', '', event.title));
    const remove = element('button', 'icon-button small event-delete'); remove.type = 'button'; remove.append(icon('trash')); remove.setAttribute('aria-label', `${event.title}を削除`);
    remove.addEventListener('click', async () => {
      remove.disabled = true;
      try { await writeStore('events', store => store.delete(event.id)); events = events.filter(item => item.id !== event.id); renderEvents(); renderCalendar(); toast('予定を削除しました。'); }
      catch { remove.disabled = false; toast('予定を削除できませんでした。'); }
    });
    item.append(element('span', 'event-symbol', event.mark), detail, remove); list.append(item);
  }
}
$('#schedule-form').addEventListener('submit', async event => {
  event.preventDefault();
  if ($('#event-submit').disabled) return;
  const date = $('#event-date').value, time = $('#event-time').value, title = $('#event-title').value.trim();
  if (!title || !validDate(date)) { toast('日付と予定の内容を入力してください。'); return; }
  const entry = { id: crypto.randomUUID(), date, time, title, mark: $('#event-mark').value };
  $('#event-submit').disabled = true;
  try {
    await writeStore('events', store => store.put(entry));
    events.push(entry); selectedDate = date;
    $('#event-title').value = ''; $('#event-time').value = '';
    renderEvents(); renderCalendar(); toast('予定を保存しました。');
  } catch { toast('予定を保存できませんでした。入力内容は残しています。', 6500); }
  finally { $('#event-submit').disabled = false; }
});

function toggleQuiet() {
  quiet = !quiet;
  if (quiet && $('#stage').contains(document.activeElement)) document.activeElement.blur();
  document.body.classList.toggle('quiet-mode', quiet);
  $$('.chrome').forEach(node => { node.inert = quiet; });
  $('#quiet-toggle').setAttribute('aria-label', quiet ? '操作パネルを表示' : '操作パネルを隠す');
  $('#quiet-toggle').setAttribute('title', quiet ? '操作パネルを表示' : '操作パネルを隠す');
  $('#quiet-toggle').setAttribute('aria-pressed', String(quiet));
  layout();
}
$('#quiet-toggle').addEventListener('click', toggleQuiet);
document.addEventListener('keydown', event => { if (event.key === 'Escape' && quiet && !document.querySelector('dialog[open]')) toggleQuiet(); });
$('#speed').value = settings.speed; $('#radius').value = settings.radius;
function rangeLabels() { $('#speed-value').textContent = `${settings.speed}° / 秒`; $('#radius-value').textContent = `${settings.radius}%`; }
$('#speed').addEventListener('input', event => { settings.speed = Number(event.target.value); rangeLabels(); savePreferences(); });
$('#radius').addEventListener('input', event => { settings.radius = Number(event.target.value); rangeLabels(); layout(); savePreferences(); });
$$('input[name=direction]').forEach(input => { input.checked = Number(input.value) === settings.direction; input.addEventListener('change', () => { settings.direction = Number(input.value); savePreferences(); }); });
$$('input[name=clock-position]').forEach(input => { input.checked = input.value === settings.clockPosition; input.addEventListener('change', () => { setClockPosition(input.value); savePreferences(); }); });
$('#frame-toggle').checked = settings.frame;
$('#frame-toggle').addEventListener('change', event => { settings.frame = event.target.checked; $$('.card-face:not(.empty-card)').forEach(face => face.classList.toggle('no-frame', !settings.frame)); orbitCards.forEach(card => card.classList.toggle('frameless', !settings.frame && photos.length > 0)); savePreferences(); });
$('#hearts-toggle').checked = settings.hearts;
$('#particles').hidden = !settings.hearts;
$('#hearts-toggle').addEventListener('change', event => { settings.hearts = event.target.checked; $('#particles').hidden = !settings.hearts; savePreferences(); });
$('#timezone').value = settings.zone;
$('#timezone').addEventListener('change', event => { settings.zone = event.target.value; updateClock(); renderCalendar(); savePreferences(); });
for (let index = 0; index < 18; index++) {
  const particle = element('span', 'particle');
  particle.style.left = `${(index * 31.73) % 100}%`;
  particle.style.setProperty('--duration', `${27 + index % 7 * 3}s`);
  particle.style.setProperty('--delay', `${-index * 4.3}s`);
  particle.style.setProperty('--size', `${13 + index % 5 * 4}px`);
  particle.style.setProperty('--rest', `${index * 17 % 90}%`);
  particle.append(icon('heart')); $('#particles').append(particle);
}
motionPreference.addEventListener('change', event => { if (event.matches) { playing = false; updatePlayback(); } });
new ResizeObserver(layout).observe($('#gallery'));
window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { lastFrame = 0; if (!document.hidden) updateClock(); });
setClockPosition(settings.clockPosition); applyCalendarVisibility(); rangeLabels(); updatePlayback(); buildCarousel(); updateClock(); renderCalendar(); renderEvents();
setInterval(updateClock, 1000);
requestAnimationFrame(animate);

(async () => {
  try {
    db = await openDB();
    const [savedPhotos, savedEvents] = await Promise.all([readAll('photos'), readAll('events')]);
    photos = savedPhotos.filter(photo => photo.blob instanceof Blob && typeof photo.name === 'string').sort((a,b) => a.order - b.order).map(photo => ({ ...photo, url: URL.createObjectURL(photo.blob) }));
    events = savedEvents.filter(event => typeof event.title === 'string' && validDate(event.date));
    storageReady = true;
    buildCarousel(); renderCalendar(); renderEvents();
  } catch { db = null; toast('このブラウザでは画像・予定の保存を利用できません。ブラウザの設定を確認し、再読み込みしてください。', 9000); }
})();

})();
</script>
